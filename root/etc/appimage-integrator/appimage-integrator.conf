# System-wide config for appimage-integrator (see appimage-integrator/README.md).
# Override per user in ~/.config/appimage-integrator/appimage-integrator.conf.

# Install directory of the integrator scripts
appimage_integrator_root="/usr/libexec/appimage-integrator"

# Default directory to observe
watch_directory="$HOME/Applications"

# Log levels to show
# 0 no logs
# 1 only errors
# 2 only errors,warnings
# 3 all (info,errrors,warnings)
log_level=1

# Show desktop notifications (true/false)
silent=false
