---
name: build-ublue-custom
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 2,5'  # 10:05am UTC, Tuesday and Friday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    name: Build and push image (${{ matrix.name }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD/Intel image, keeps the repository name
          - name: default
            image_suffix: ""
            source_image: bazzite
            image_desc: "My Customized Universal Blue Image"
          # Nvidia image, based on bazzite-nvidia-open
          - name: nvidia
            image_suffix: "-nvidia"
            source_image: bazzite-nvidia
            image_desc: "My Customized Universal Blue Image (Nvidia)"

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      MY_IMAGE_NAME: "${{ github.event.repository.name }}${{ matrix.image_suffix }}"  # matches the repo name, plus a variant suffix
      MY_IMAGE_DESC: "${{ matrix.image_desc }}"

    steps:
      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v10

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          # Generate a timestamp for creating an image version history
          TIMESTAMP="$(date +%Y%m%d)"
          COMMIT_TAGS=()
          BUILD_TAGS=()

          # Have tags for tracking builds during pull request
          SHA_SHORT="${GITHUB_SHA::7}"
          COMMIT_TAGS+=("pr-${{ github.event.number }}")
          COMMIT_TAGS+=("${SHA_SHORT}")

          # Append matching timestamp tags to keep a version history
          for TAG in "${BUILD_TAGS[@]}"; do
              BUILD_TAGS+=("${TAG}-${TIMESTAMP}")
          done

          BUILD_TAGS+=("${TIMESTAMP}")
          BUILD_TAGS+=("latest")

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "Generated the following commit tags: "
              for TAG in "${COMMIT_TAGS[@]}"; do
                  echo "${TAG}"
              done

              alias_tags=("${COMMIT_TAGS[@]}")
          else
              alias_tags=("${BUILD_TAGS[@]}")
          fi

          echo "Generated the following build tags: "
          for TAG in "${BUILD_TAGS[@]}"; do
              echo "${TAG}"
          done

          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.MY_IMAGE_NAME }}

          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=${{ env.MY_IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.MY_IMAGE_NAME }}

      # Compiling the ZFS kmod is slow, so cache the resulting RPMs. They only
      # depend on the base image kernel, ZFS_VERSION and build-zfs.sh.
      - name: Compute ZFS cache key
        id: zfs-key
        shell: bash
        run: |
          set -euo pipefail
          BASE="docker://ghcr.io/ublue-os/${{ matrix.source_image }}:stable"
          INSPECT="$(skopeo inspect --no-tags "${BASE}")"
          KERNEL="$(jq -r '.Labels["ostree.linux"] // empty' <<< "${INSPECT}")"
          # Fall back to the image digest so a missing label never reuses stale RPMs.
          KERNEL="${KERNEL:-$(jq -r '.Digest' <<< "${INSPECT}" | tr ':' '-')}"
          ZFS_VERSION="$(sed -n 's/^ARG ZFS_VERSION="\(.*\)"/\1/p' Containerfile)"
          echo "Base kernel: ${KERNEL}, ZFS: ${ZFS_VERSION}"
          # Pin both builds below to the inspected image so the kernel matches the key.
          echo "source_tag=stable@$(jq -r '.Digest' <<< "${INSPECT}")" >> "$GITHUB_OUTPUT"
          echo "key=zfs-rpms-${{ matrix.source_image }}-${KERNEL}-${ZFS_VERSION}-${{ hashFiles('build-zfs.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached ZFS RPMs
        id: zfs-cache
        uses: actions/cache/restore@v4
        with:
          path: zfs-rpms/*.rpm
          key: ${{ steps.zfs-key.outputs.key }}

      # On a cache miss, build only the zfs-builder stage and extract its RPMs so
      # they can be cached and reused by the image build below.
      - name: Build ZFS RPMs
        if: steps.zfs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          buildah build \
            --target zfs-builder \
            --build-arg SOURCE_IMAGE=${{ matrix.source_image }} \
            --build-arg SOURCE_TAG=${{ steps.zfs-key.outputs.source_tag }} \
            --tag localhost/zfs-builder \
            -f Containerfile .
          CTR="$(podman create localhost/zfs-builder)"
          podman cp "${CTR}:/var/cache/zfs-rpms/." zfs-rpms/
          podman rm "${CTR}"
          podman rmi localhost/zfs-builder
          ls -l zfs-rpms/

      - name: Save ZFS RPMs to cache
        if: steps.zfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: zfs-rpms/*.rpm
          key: ${{ steps.zfs-key.outputs.key }}

      # Build image using Buildah action
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.MY_IMAGE_NAME }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          build-args: |
            SOURCE_IMAGE=${{ matrix.source_image }}
            SOURCE_TAG=${{ steps.zfs-key.outputs.source_tag }}
            IMAGE_VARIANT=${{ matrix.name }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: false

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # A Containerfile RUN produces one big layer whose bytes change on every
      # build, so clients re-download all of it on each update. Rechunking splits
      # the image into per-package layers with reproducible content, so updates
      # only pull layers whose packages changed. --previous-build reuses the
      # layer plan of the published image to keep the packing stable.
      # Same approach as https://github.com/ublue-os/image-template
      - name: Rechunk Image
        shell: bash
        env:
          IMAGE: ${{ steps.build_image.outputs.image }}
          TAGS: ${{ steps.build_image.outputs.tags }}
          PREVIOUS_BUILD: docker://${{ steps.registry_case.outputs.lowercase }}/${{ env.MY_IMAGE_NAME }}:latest
        run: |
          set -euo pipefail
          read -ra TAG_LIST <<< "${TAGS}"
          SRC="localhost/${IMAGE}:${TAG_LIST[0]}"

          # --rootfs drops the image config, so carry the labels over. ostree.*
          # and containers.bootc labels are regenerated by the rechunker.
          LABEL_ARGS=()
          while IFS= read -r label; do
            LABEL_ARGS+=(--label "${label}")
          done < <(podman inspect "${SRC}" | jq -r '.[0].Labels // {} | to_entries[]
            | select(.key | IN("ostree.commit", "ostree.final-diffid", "containers.bootc") | not)
            | "\(.key)=\(.value)"')

          # The first build after enabling rechunking has no chunked baseline.
          PREVIOUS_ARGS=()
          if skopeo inspect --raw "${PREVIOUS_BUILD}" | jq -e '.layers[1].annotations["ostree.components"]' > /dev/null 2>&1; then
            PREVIOUS_ARGS=(--previous-build "${PREVIOUS_BUILD}")
          fi

          GRAPHROOT="$(podman info --format '{{.Store.GraphRoot}}')"
          DRIVER="$(podman info --format '{{.Store.GraphDriverName}}')"

          podman run --rm --pull=never --privileged \
            --mount=type=image,src="${SRC}",target=/rpm-ostree \
            --mount=type=bind,src="${GRAPHROOT}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "${SRC}" \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            "${PREVIOUS_ARGS[@]}" \
            "${LABEL_ARGS[@]}" \
            --output "containers-storage:[${DRIVER}@/run/host-container-storage+/run/rpm-ostree-storage]${SRC}"

          for TAG in "${TAG_LIST[@]:1}"; do
            podman tag "${SRC}" "localhost/${IMAGE}:${TAG}"
          done
          podman image prune -f
          podman inspect "${SRC}" | jq '.[0].RootFS.Layers | length'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.lowercase }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.

      # Sign container
      - uses: sigstore/cosign-installer@v3.8.1
        if: github.event_name != 'pull_request'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ steps.registry_case.outputs.lowercase }}/${{ steps.build_image.outputs.image }}@${TAGS}
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
